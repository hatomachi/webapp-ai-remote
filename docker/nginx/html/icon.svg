<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#grad1)" stroke-width="6" opacity="0.4" />
  
  <!-- Antenna / Remote waves -->
  <path d="M 180 160 C 220 125 292 125 332 160" fill="none" stroke="url(#grad1)" stroke-width="20" stroke-linecap="round" />
  <path d="M 210 195 C 235 175 277 175 302 195" fill="none" stroke="url(#grad1)" stroke-width="18" stroke-linecap="round" />

  <!-- Cockpit Bot / Terminal Body -->
  <rect x="136" y="220" width="240" height="180" rx="32" fill="#1e293b" stroke="url(#grad1)" stroke-width="16" filter="url(#glow)" />
  
  <!-- Screen Elements: Code prompt & cursor -->
  <path d="M 180 275 L 215 310 L 180 345" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="240" y1="345" x2="280" y2="345" stroke="#a855f7" stroke-width="18" stroke-linecap="round" />
  
  <!-- Indicator Dot -->
  <circle cx="335" cy="275" r="14" fill="#22c55e" />
</svg>
