---
- name: Setup Shared EC2 AI Remote Cockpit Platform
  hosts: ec2, localhost
  become: true
  vars:
    base_data_dir: /data
    base_repos_dir: /data/base-repos
    workspaces_dir: /data/workspaces
    logs_dir: /data/logs
    app_dir: /opt/webapp-ai-remote
    node_version: "20"
    app_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    is_container: "{{ ansible_virtualization_type in ['docker', 'containerd', 'podman'] or (ansible_is_chroot | default(false)) }}"
    hub_url: "ws://localhost:8090/ws/agent"
    enable_user_sandbox: true
    sandbox_user_prefix: "ai-"
    sandbox_shared_group: "ai-shared"

  roles:
    - common
    - role: docker
      when: not is_container
    - ai_tools
    - webapp_remote
