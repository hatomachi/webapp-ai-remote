events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket用のConnectionヘッダー切り替え
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream hub_backend {
        server hub:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # 静的フロントエンド（仮ウェルカムページ / 後ほどWeb PWAのビルド成果物）
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Relay Hub ヘルスチェック
        location /health {
            proxy_pass http://hub_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket: Agent接続 (/ws/agent)
        location /ws/agent {
            proxy_pass http://hub_backend/ws/agent;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket: Client接続 (/ws/client)
        location /ws/client {
            proxy_pass http://hub_backend/ws/client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
