---
- name: Install Docker prerequisites (Debian/Ubuntu)
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  when: ansible_os_family == "Debian"

- name: Create keyrings directory (Debian/Ubuntu)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Download Docker official GPG key (Debian/Ubuntu)
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Add Docker apt repository (Debian/Ubuntu)
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: ansible_os_family == "Debian"

- name: Install Docker packages (Debian/Ubuntu)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install Docker packages (RedHat/Amazon Linux)
  dnf:
    name:
      - docker
    state: present
  when: ansible_os_family == "RedHat"

- name: Create Docker CLI plugins directory (RedHat/Amazon Linux)
  file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: '0755'
  when: ansible_os_family == "RedHat"

- name: Install Docker Compose plugin (RedHat/Amazon Linux)
  get_url:
    url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ 'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: '0755'
  when: ansible_os_family == "RedHat"

- name: Ensure docker group exists
  group:
    name: docker
    state: present

- name: Add app_user to docker group
  user:
    name: "{{ app_user }}"
    groups: docker
    append: yes
  when: app_user is defined and app_user != '' and app_user != 'root'

- name: Ensure Docker service is running and enabled (systemd hosts)
  service:
    name: docker
    state: started
    enabled: yes
  when: not is_container and ansible_service_mgr == "systemd"
