---
- name: Determine application group
  set_fact:
    resolved_group: "{{ 'root' if app_user == 'root' else app_user }}"

- name: Create data and application directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ resolved_group }}"
    mode: '0755'
  loop:
    - "{{ base_data_dir }}"
    - "{{ base_repos_dir }}"
    - "{{ workspaces_dir }}"
    - "{{ logs_dir }}"
    - "{{ app_dir }}"

- name: Setup auto git fetch cron for base-repos
  cron:
    name: "Sync all base-repos every 5 minutes"
    minute: "*/5"
    job: "for d in {{ base_repos_dir }}/*; do [ -d \"$d/.git\" ] && git -C \"$d\" fetch --all -q; done >/dev/null 2>&1"
    user: "{{ app_user }}"

- name: Check if application already exists in app_dir
  stat:
    path: "{{ app_dir }}/package.json"
  register: app_pkg_check

- name: Deploy application source to app_dir if not present
  command: "cp -r {{ playbook_dir }}/../../. {{ app_dir }}/"
  args:
    creates: "{{ app_dir }}/package.json"
  when: not app_pkg_check.stat.exists

- name: Ensure app_dir ownership
  file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ resolved_group }}"
    recurse: yes

- name: Install root npm dependencies
  command: npm install --include=dev
  args:
    chdir: "{{ app_dir }}"
  environment:
    NODE_ENV: development
  changed_when: false

- name: Build Web PWA and deploy to Nginx directory
  command: npm run web:deploy
  args:
    chdir: "{{ app_dir }}"
  changed_when: false

- name: Create shared group for multi-tenant AI sandbox
  group:
    name: "{{ sandbox_shared_group | default('ai-shared') }}"
    state: present

- name: Configure sudoers for AI sandbox privilege dropping
  copy:
    dest: /etc/sudoers.d/webapp-ai-remote
    content: |
      # Generated by Ansible for Shared EC2 AI Remote (Phase 4 Sandbox)
      {{ app_user }} ALL=(ALL) NOPASSWD: ALL
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Configure Agent .env file
  copy:
    dest: "{{ app_dir }}/packages/agent/.env"
    content: |
      # Generated by Ansible for Shared EC2 AI Remote
      HUB_URL={{ hub_url }}
      DEFAULT_CWD={{ workspaces_dir }}
      BASE_DATA_DIR={{ base_data_dir }}
      ENABLE_USER_SANDBOX={{ 'true' if (enable_user_sandbox | default(true)) else 'false' }}
      SANDBOX_USER_PREFIX={{ sandbox_user_prefix | default('ai-') }}
      SANDBOX_SHARED_GROUP={{ sandbox_shared_group | default('ai-shared') }}
      SANDBOX_EXEC_METHOD=auto
    owner: "{{ app_user }}"
    group: "{{ resolved_group }}"
    mode: '0644'

- name: Deploy systemd service unit for Agent
  template:
    src: agent.service.j2
    dest: /etc/systemd/system/webapp-ai-remote-agent.service
    mode: '0644'

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  when: not is_container and ansible_service_mgr == "systemd"

- name: Start and enable Docker Compose services (Nginx & Hub)
  command: docker compose up -d
  args:
    chdir: "{{ app_dir }}"
  when: not is_container and ansible_service_mgr == "systemd"
  changed_when: false

- name: Start and enable Agent systemd service
  systemd:
    name: webapp-ai-remote-agent
    state: started
    enabled: yes
  when: not is_container and ansible_service_mgr == "systemd"
