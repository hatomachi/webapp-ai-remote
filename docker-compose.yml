services:
  hub:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: node packages/hub/src/index.js
    environment:
      - PORT=3001
    expose:
      - "3001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - hub
    restart: unless-stopped
